services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Data Source=/data/application.db
      SYSTEMDATA_SOURCE: https://raw.githubusercontent.com/hrbolek/_uois/latest/systemdata.hk2026.json
    volumes:
      - ./data:/data
    expose:
      - "8080"

  fake-entra:
    image: ghcr.io/hrbolek/easy_entra_id-fake:latest
    depends_on:
      - app
    environment:
      APPLICATIONS_JSON: >-
        {
          "webapp": {
            "upstream": "http://app:8080",
            "allowed_corridor_prefixes": [
              "/swagger",
              "/architecture"
            ]
          }
        }
    ports:
      - "8000:8000"
