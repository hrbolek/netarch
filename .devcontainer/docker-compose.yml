services:

  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    volumes:
      - ..:/workspace:cached

    working_dir: /workspace

    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080

    expose:
      - "8080"

    command: sleep infinity


  easy-entra-fake:
    build:
      context: https://github.com/hrbolek/easy_entra_id.git#main:fake

    environment:
      TARGET_SERVER: http://app:8080

    ports:
      - "8000:8000"

    depends_on:
      - app


  serverjsonata:
    # context: .
    image: hrbolek/jsonata-federation:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile.JSONata
    ports:
      - "8303:3000"
    environment:
      PORT: "3000"
      # ENDPOINTS_CONFIG_PATH: /app/endpoints.json
      FORWARD_HEADERS: cookie,authorization,accept,accept-language,x-request-id,x-ms-client-principal,x-ms-client-principal-id,x-ms-client-principal-name
      ENDPOINTS_CONFIG_PATH: /app/config/endpoints.json
    volumes:
      - ../config:/app/config:ro
    # volumes:
    #   - ./serverjsonata/endpoints.json:/app/endpoints.json:ro

  whoami:
    image: traefik/whoami:latest    

  jsonata-ui:
    image: nginx:alpine
    ports:
      - "8304:80"
    volumes:
      - ../config/index.html:/usr/share/nginx/html/index.html:ro
      - ../config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - serverjsonata         


  postgres_test:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: data
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d data"]
        interval: 5s
        timeout: 5s
        retries: 10

  postgres_development:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: data
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d data"]
        interval: 5s
        timeout: 5s
        retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: anoyne@anywhere.com
      PGADMIN_DEFAULT_PASSWORD: example
      PGADMIN_CONFIG_SESSION_COOKIE_NAME: "'pgadmin_za78_session'"
    ports:
      - "9080:80"
    depends_on:
      - postgres_test
      - postgres_development
  
