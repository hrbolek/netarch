services:

  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    volumes:
      - ..:/workspace:cached

    working_dir: /workspace

    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080

    expose:
      - "8080"

    command: sleep infinity


  easy-entra-fake:
    build:
      context: https://github.com/hrbolek/easy_entra_id.git#main:fake

    environment:
      TARGET_SERVER: http://app:8080

    ports:
      - "8000:8000"

    depends_on:
      - app